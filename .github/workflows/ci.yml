name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The contract tests run the compiled circuits from `managed/`, which is
      # committed. That means CI needs neither the Compact compiler nor Docker
      # to verify the contract logic.
      - name: Run contract tests
        run: npm test
